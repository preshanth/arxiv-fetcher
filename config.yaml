# ArXiv Astro-ph Daily Fetcher Configuration
# Preshanth's Research Interests - Radio Astronomy Focus

# Primary arXiv categories to query
arxiv_categories:
  - "astro-ph.IM"  # Instrumentation and Methods for Astrophysics
  - "astro-ph.GA"  # Astrophysics of Galaxies
  - "astro-ph.CO"  # Cosmology and Nongalactic Astrophysics
  - "astro-ph.HE"  # High Energy Astrophysical Phenomena

# User's active research tags (hierarchical)
active_tags:
  # Broad categories (at least one should match)
  primary_categories:
    - extragalactic
    - instrumentation
    - galactic
  
  # Specific research interests (match these for high relevance)
  facilities:
    - vla
    - meerkat
    - alma
    - ska
    - gmrt
    - lofar
    - askap
    - wsrt
  
  techniques:
    - radio_interferometry
    - interferometry
    - polarimetry
    - spectroscopy
    - imaging
    - widefield_imaging
  
  data_processing:
    - calibration
    - rfi_mitigation
    - rfi
    - flagging
    - pipeline
    - data_reduction
    - imaging_algorithms
  
  computational:
    - machine_learning
    - deep_learning
    - gpu_acceleration
    - gpu
    - distributed_computing
    - parallel_processing
    - algorithms
  
  science_topics:
    - cosmic_magnetism
    - faraday_rotation
    - absorption_lines
    - hi_surveys
    - continuum_emission
    - molecular_lines
    - radio_galaxies
    - quasars

# Keyword patterns for fast text matching
keyword_patterns:
  radio_interferometry:
    - "interferometry"
    - "interferometer"
    - "baseline"
    - "visibility"
    - "uv-plane"
    - "synthesis imaging"
  
  rfi_mitigation:
    - "rfi"
    - "radio frequency interference"
    - "interference mitigation"
    - "rflag"
    - "aoflagger"
    - "interference excision"
  
  polarimetry:
    - "polarimetry"
    - "polarimetric"
    - "stokes"
    - "faraday"
    - "rotation measure"
    - "linear polarization"
    - "circular polarization"
    - "radio polarization"
    # NOTE: bare "polarization" removed - matches unrelated physics/chemistry
    # contexts (e.g. electronic/dielectric polarization) far more often than
    # radio polarimetry. Caught 2026-09-16 on a chemistry DFT paper.
  
  calibration:
    - "calibration"
    - "self-calibration"
    - "gain calibration"
    - "bandpass"
    - "flux calibration"
    - "phase calibration"
  
  machine_learning:
    - "machine learning"
    - "deep learning"
    - "neural network"
    - "convolutional"
    - "transformer"
    - "random forest"
    # NOTE: bare "classification" removed - matches any classification task
    # (galaxy morphology, spectral type, etc), not specifically ML/DL usage.
  
  gpu_computing:
    - "gpu"
    - "cuda"
    - "graphics processing"
    - "gpu acceleration"
    - "parallel computing"

# Filtering thresholds
filtering:
  # A facility mention (VLA, MeerKAT, etc.) accepts a paper on its own -
  # it's a strong, low-false-positive signal. Keyword-pattern matches alone
  # need at least this many hits, since single generic keywords (e.g. a bare
  # "polarization" match) are common false positives outside radio astronomy.
  keyword_score_medium: 2

  # Date range
  days_to_fetch: 1  # Fetch last N days of papers

# TACC inference endpoint (OpenAI-compatible)
tacc:
  base_url: "https://ai.tejas.tacc.utexas.edu"
  api_key_env: "TACC_API_KEY"   # key is read from this env var, never stored here

  # Pool of models to rotate through for generate/verify roles.
  # Generator and verifier are picked from this list per paper (verifier != generator).
  # Confirmed live 2026-09-15; Llama-4-Maverick-17B-128E-Instruct excluded (503 unavailable).
  models:
    - "DeepSeek-V3.2"
    - "Mistral-Large-3-675B-Instruct-2512"
    - "Qwen3-235B-A22B-Instruct-2507"
    - "gpt-oss-120b"

  embedding_model: "E5-Mistral-7B-Instruct"

  temperature: 0.2
  max_tokens: 4096

# Output configuration
output:
  save_filtered_papers: true
  output_dir: "./arxiv_papers"
  cache_dir: "./arxiv_cache"
  log_filtering_decisions: true
  db_path: "./arxiv_papers.db"
  docs_dir: "./docs"
