name: Deploy site

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Render site from DB and build with Jekyll + Pagefind
        run: |
          distrobox-enter cuda -- bash -c '
            set -e
            export PATH="$(ruby -e "puts Gem.user_dir")/bin:$PATH"
            pixi run python render_site.py
            jekyll build --source docs --destination _site
            pagefind --site _site
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
